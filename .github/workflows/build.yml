name: Build, Test & Lint

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: 0 4 * * 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [stable, beta, dev]
    defaults:
      run:
        working-directory: chrono/
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get

      - run: dart analyze

  chrono-test:
    name: "Package chrono: Run Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrono/
    strategy:
      matrix:
        sdk: [stable, beta, dev]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart test

  chrono-coverage:
    name: "Package chrono: Coverage"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrono/
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get

      - run: dart pub global activate coverage ^1.0.0
      - run: dart pub global run coverage:test_with_coverage

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  chrono-timezone-test:
    name: "Package chrono_timezone: Run Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrono_timezone/
    strategy:
      matrix:
        sdk: [stable, beta, dev]
    steps:
      - uses: actions/checkout@v7
        with:
          # The tests compare the generated data to the tz source files.
          submodules: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # The tests compile the tz source files using the runner's `zic`.
      - run: zic --version
      - run: dart test
